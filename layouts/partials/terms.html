{{- $taxonomy := .taxonomy -}}
{{- $page := .page -}}
{{- with $page.GetTerms $taxonomy -}}
  <div class="mt-8 pt-6 border-t border-zinc-100 dark:border-zinc-800">
    <p class="text-xs font-semibold uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-3">{{ i18n "tags_label" }}</p>
    <div class="flex flex-wrap gap-2">
      {{- range . -}}
        <a href="{{ .RelPermalink }}" class="inline-block text-xs px-3 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-400 hover:bg-blue-100 dark:hover:bg-blue-900/50 hover:text-blue-700 dark:hover:text-blue-300 transition-colors font-medium">{{ .LinkTitle }}</a>
      {{- end -}}
    </div>
  </div>
{{- end -}}
