<div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8">
  <div class="flex items-center h-14 gap-3">
    <!-- Mobile menu toggle + Logo -->
    <div class="flex items-center gap-2">
      <button class="flex items-center justify-center w-9 h-9 rounded-lg text-zinc-500 hover:text-zinc-700 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-zinc-200 dark:hover:bg-zinc-800 transition-colors toggle-button" data-target="menu-bar" aria-label="Toggle menu">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </button>
      <div class="relative">
        {{ if .IsHome }}
          <h1>
            <a href="{{ "/" | relLangURL }}" class="flex items-center gap-2 font-bold text-lg text-zinc-900 dark:text-zinc-100 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
              <span class="w-7 h-7 rounded-md bg-blue-600 flex items-center justify-center flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16" class="group-hover:animate-spin">
                  <path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                  <path d="M13.997 5.17a5 5 0 0 0-8.101-4.09A5 5 0 0 0 1.28 9.342a5 5 0 0 0 8.336 5.109 3.5 3.5 0 0 0 5.201-4.065 3.001 3.001 0 0 0-.822-5.216zm-1-.034a1 1 0 0 0 .668.977 2.001 2.001 0 0 1 .547 3.478 1 1 0 0 0-.341 1.113 2.5 2.5 0 0 1-3.715 2.905 1 1 0 0 0-1.262.152 4 4 0 0 1-6.67-4.087 1 1 0 0 0-.2-1 4 4 0 0 1 3.693-6.61 1 1 0 0 0 .8-.2 4 4 0 0 1 6.48 3.273z"/>
                </svg>
              </span>
              {{ .Site.Title }}
            </a>
          </h1>
        {{ else }}
          <h2>
            <a href="{{ "/" | relLangURL }}" class="flex items-center gap-2 font-bold text-lg text-zinc-900 dark:text-zinc-100 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
              <span class="w-7 h-7 rounded-md bg-blue-600 flex items-center justify-center flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="white" viewBox="0 0 16 16">
                  <path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                  <path d="M13.997 5.17a5 5 0 0 0-8.101-4.09A5 5 0 0 0 1.28 9.342a5 5 0 0 0 8.336 5.109 3.5 3.5 0 0 0 5.201-4.065 3.001 3.001 0 0 0-.822-5.216zm-1-.034a1 1 0 0 0 .668.977 2.001 2.001 0 0 1 .547 3.478 1 1 0 0 0-.341 1.113 2.5 2.5 0 0 1-3.715 2.905 1 1 0 0 0-1.262.152 4 4 0 0 1-6.67-4.087 1 1 0 0 0-.2-1 4 4 0 0 1 3.693-6.61 1 1 0 0 0 .8-.2 4 4 0 0 1 6.48 3.273z"/>
                </svg>
              </span>
              {{ .Site.Title }}
            </a>
          </h2>
        {{ end }}
      </div>
    </div>

    <!-- Right side actions -->
    <div class="flex items-center gap-2 ml-auto">
      {{- $currentLang := .Site.Language.Lang -}}
      {{- range .AllTranslations -}}
        {{- if ne .Lang $currentLang -}}
          <a class="flex items-center rounded-lg px-3 py-1.5 text-xs font-semibold text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" href="{{ .RelPermalink }}">{{ upper .Lang }}</a>
        {{- end -}}
      {{- end -}}
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode" class="flex items-center justify-center w-9 h-9 rounded-lg text-zinc-500 hover:text-zinc-700 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-zinc-200 dark:hover:bg-zinc-800 transition-colors">
        <svg id="theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="hidden" viewBox="0 0 16 16">
          <path d="M8 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM8 0a.5.5 0 0 1 .5.5V2a.5.5 0 0 1-1 0V.5A.5.5 0 0 1 8 0zm0 14a.5.5 0 0 1 .5.5V16a.5.5 0 0 1-1 0v-1.5A.5.5 0 0 1 8 14zM16 8a.5.5 0 0 1-.5.5H14a.5.5 0 0 1 0-1h1.5A.5.5 0 0 1 16 8zM2 8a.5.5 0 0 1-.5.5H0a.5.5 0 0 1 0-1h1.5A.5.5 0 0 1 2 8zm11.657-5.657a.5.5 0 0 1 0 .707L12.596 4.11a.5.5 0 1 1-.707-.707l1.06-1.06a.5.5 0 0 1 .708 0zM4.11 11.89a.5.5 0 0 1 0 .707l-1.06 1.06a.5.5 0 1 1-.708-.707l1.061-1.06a.5.5 0 0 1 .707 0zm9.547 1.767a.5.5 0 0 1-.707 0l-1.061-1.06a.5.5 0 0 1 .707-.708l1.061 1.06a.5.5 0 0 1 0 .708zM4.11 4.11a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.06 1.06a.5.5 0 0 1 0 .708z"/>
        </svg>
        <svg id="theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="block" viewBox="0 0 16 16">
          <path d="M6 0a.75.75 0 0 1 .747.681A6.5 6.5 0 0 0 14.819 8.75a.75.75 0 0 1 .818.818A8 8 0 1 1 6.432.092.75.75 0 0 1 6 0z"/>
        </svg>
      </button>
    </div>
  </div>
  {{- partial "menu.html" (dict "menuID" "main" "page" .) -}}
</div>
