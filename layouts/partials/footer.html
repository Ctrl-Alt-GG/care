<div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8">
  <div class="flex flex-col md:flex-row md:items-start gap-10 mb-10">
    <!-- Brand -->
    <div class="md:w-2/5">
      <a class="flex items-center gap-2.5 mb-4 group" href="{{ "/" | relLangURL }}">
        <span class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="white" class="group-hover:animate-spin" viewBox="0 0 16 16">
            <path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
            <path d="M13.997 5.17a5 5 0 0 0-8.101-4.09A5 5 0 0 0 1.28 9.342a5 5 0 0 0 8.336 5.109 3.5 3.5 0 0 0 5.201-4.065 3.001 3.001 0 0 0-.822-5.216zm-1-.034a1 1 0 0 0 .668.977 2.001 2.001 0 0 1 .547 3.478 1 1 0 0 0-.341 1.113 2.5 2.5 0 0 1-3.715 2.905 1 1 0 0 0-1.262.152 4 4 0 0 1-6.67-4.087 1 1 0 0 0-.2-1 4 4 0 0 1 3.693-6.61 1 1 0 0 0 .8-.2 4 4 0 0 1 6.48 3.273z"/>
          </svg>
        </span>
        <span class="text-lg font-bold text-zinc-900 dark:text-zinc-100">{{ .Site.Title }}</span>
      </a>
      <p class="text-sm font-medium text-zinc-700 dark:text-zinc-300 mb-2">{{ i18n "footer_tagline" }}</p>
      <p class="text-sm text-zinc-500 dark:text-zinc-400 leading-relaxed">{{ i18n "footer_desc" }}</p>
    </div>
    <!-- Links -->
    <div class="md:w-3/5 md:flex md:justify-end">
      <nav>
        <p class="text-xs font-semibold uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-4">{{ i18n "footer_nav_label" | default "Navigation" }}</p>
        <ul class="flex flex-wrap gap-x-6 gap-y-3">
          {{ range .Site.Menus.main }}
            <li><a class="text-sm text-zinc-600 dark:text-zinc-400 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-colors" href="{{ .URL }}">{{ .Name }}</a></li>
          {{ end }}
        </ul>
      </nav>
    </div>
  </div>
  <div class="border-t border-zinc-200 dark:border-zinc-800 pt-6">
    <p class="text-xs text-zinc-400 dark:text-zinc-500">Copyright &copy; {{ now.Year }} Ctrl-Alt-GG. {{ i18n "footer_all_rights_reserved" }}</p>
  </div>
</div>
