<article class="relative group flex flex-row">
	<a class="insert-link" href="{{ .Permalink }}" aria-label="{{ .LinkTitle }}"></a>

	{{- if .Params.image }}
	<figure class="basis-1/3 aspect-square overflow-hidden rounded-2xl bg-zinc-100 dark:bg-zinc-800">
		{{- if (strings.HasPrefix .Params.image "http") }}
		<img class="object-cover h-full w-full group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ .Params.image }}" alt="{{ .Title }}">
		{{- else }}
		{{- with $imglist := resources.Get .Params.image -}}
		{{- $croppedImg := $imglist.Crop "250x250 Center" -}}
		<img class="object-cover h-full w-full group-hover:scale-105 transition duration-500 cursor-pointer" src="{{ $croppedImg.Permalink }}" alt="{{ $.Title }}" width="{{ $croppedImg.Width }}" height="{{ $croppedImg.Height }}">
		{{- end }}
		{{- end }}
	</figure>
	{{- end }}

	<div class="{{ if .Params.image }}basis-2/3 ml-4{{ else }}basis-full{{ end }} self-center">
		<h3 class="font-bold group-hover:underline decoration-auto">{{ .LinkTitle }}</h3>
	</div>
</article>
