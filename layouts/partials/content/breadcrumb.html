{{- if not .IsHome -}}
<nav id="breadcrumb" class="py-6" aria-label="Breadcrumb">
  <ol class="flex items-center gap-1.5 text-sm text-zinc-400 dark:text-zinc-500 flex-wrap">
    <li>
      <a href="{{ "/" | relLangURL }}" class="hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors font-medium">{{ i18n "breadcrumb_home" }}</a>
    </li>
    {{- if .IsPage -}}
      {{- with .CurrentSection -}}
        {{- if not .IsHome -}}
          <li class="text-zinc-300 dark:text-zinc-600 select-none">/</li>
          <li>
            <a href="{{ .RelPermalink }}" class="hover:text-zinc-600 dark:hover:text-zinc-300 transition-colors font-medium">{{ .Title }}</a>
          </li>
        {{- end -}}
      {{- end -}}
      <li class="text-zinc-300 dark:text-zinc-600 select-none">/</li>
      <li class="text-zinc-700 dark:text-zinc-300 font-medium truncate max-w-xs" aria-current="page">{{ .Title }}</li>
    {{- else -}}
      <li class="text-zinc-300 dark:text-zinc-600 select-none">/</li>
      <li class="text-zinc-700 dark:text-zinc-300 font-medium" aria-current="page">{{ .Title }}</li>
    {{- end -}}
  </ol>
</nav>
{{- end -}}
