<article class="relative group flex flex-col bg-zinc-50 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl hover:border-blue-300 dark:hover:border-blue-700 hover:shadow-sm hover:-translate-y-0.5 transition-all duration-200">
  <a class="insert-link" href="{{ .Permalink }}" aria-label="{{ .LinkTitle }}"></a>
  <div class="p-5 flex flex-col flex-1">
    <h3 class="font-semibold text-zinc-900 dark:text-zinc-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors mb-2 text-base leading-snug">{{ .LinkTitle }}</h3>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 line-clamp-2 leading-relaxed flex-1">{{ .Params.description }}</p>
    <div class="mt-4 flex items-center text-xs font-medium text-zinc-400 dark:text-zinc-500 group-hover:text-blue-500 dark:group-hover:text-blue-400 transition-colors">
      <span>{{ i18n "read_more" | default "Read more" }}</span>
      <svg class="ml-1 w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </div>
  </div>
</article>
