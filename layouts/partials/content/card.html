<article class="relative overflow-hidden rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 group flex flex-col transition-[transform,box-shadow,border-color] duration-[250ms] hover:-translate-y-[3px] hover:[box-shadow:var(--shadow-card-hover)] hover:[border-color:var(--border-card-hover)] before:content-[''] before:absolute before:top-0 before:inset-x-0 before:h-[2px] before:z-[1] before:[background:var(--gradient-brand)]">
  <a class="absolute inset-0 z-[2]" href="{{ .Permalink }}" aria-label="{{ .LinkTitle | markdownify | plainify | htmlUnescape }}"></a>
  <div class="p-5 flex flex-col flex-1">
    <h3 class="font-semibold text-zinc-900 dark:text-zinc-100 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors mb-2 text-base leading-snug">{{ .LinkTitle }}</h3>
    <p class="text-sm text-zinc-500 dark:text-zinc-400 line-clamp-2 leading-relaxed flex-1">{{ .Params.description }}</p>
    <div class="mt-4 flex items-center text-xs font-medium text-zinc-400 dark:text-zinc-500 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">
      <span>{{ i18n "read_more" | default "Read more" }}</span>
      {{ partial "icon.html" (dict "name" "arrow-right" "class" "ml-1 w-3.5 h-3.5") }}
    </div>
  </div>
</article>
