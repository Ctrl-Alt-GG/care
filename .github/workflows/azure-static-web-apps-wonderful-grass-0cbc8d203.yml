name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  SITE_ARTIFACT_NAME: site-${{ github.run_id }}

concurrency:
  group: site-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_site_job:
    if: github.event_name == 'push' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build Site
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.0'
          extended: true
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      - name: Build Tailwind CSS
        run: npm run build:css
      - name: Build Hugo site
        run: hugo --environment production --minify
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: public/
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 30

  build_and_deploy_push_job:
    needs: build_site_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job (Push)
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Verify current main commit
        uses: actions/github-script@v9
        id: current
        with:
          result-encoding: string
          script: |
            const branchName = context.ref.replace('refs/heads/', '')
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: branchName,
            })
            return branch.commit.sha === context.sha
      - name: Download site artifact
        if: steps.current.outputs.result == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: public/
      - name: Get Id Token
        if: steps.current.outputs.result == 'true'
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        if: steps.current.outputs.result == 'true'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GRASS_0CBC8D203 }}
          action: "upload"
          app_location: "/public"
          api_location: ""
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  build_and_deploy_pr_job:
    needs: build_site_job
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build and Deploy Job (Pull Request)
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: public/
      - name: Get Id Token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GRASS_0CBC8D203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/public"
          api_location: ""
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  publish_oci_image_job:
    needs: build_site_job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Publish OCI Image
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify current main commit
        uses: actions/github-script@v9
        id: current
        with:
          result-encoding: string
          script: |
            const branchName = context.ref.replace('refs/heads/', '')
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo,
              branch: branchName,
            })
            return branch.commit.sha === context.sha
      - if: steps.current.outputs.result == 'true'
        uses: actions/checkout@v6
      - name: Download site artifact
        if: steps.current.outputs.result == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: public/
      - name: Set up Docker Buildx
        if: steps.current.outputs.result == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.result == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        if: steps.current.outputs.result == 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish OCI image
        if: steps.current.outputs.result == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Ctrl-Alt-GG Care
            org.opencontainers.image.description=Support and care hub for the Ctrl-Alt-GG LAN community
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      pull-requests: write
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GRASS_0CBC8D203 }}
          action: "close"
